<body data-tool="html-css-format">
<main class="s3-main">
  <section class="s3-hero">
    <h1>HTML CSS Format</h1>
    <p>Beautify or minify HTML and CSS. The result is shown as highlighted code, never rendered, and nothing leaves your browser.</p>
  </section>

  <div class="grid-2 hc-grid">
    <section class="card stack">
      <div class="row between">
        <div class="seg" id="lang" role="group" aria-label="Language">
          <button aria-pressed="true" data-v="html">HTML</button>
          <button aria-pressed="false" data-v="css">CSS</button>
        </div>
        <div class="row">
          <button class="btn ghost small" id="sample">Sample</button>
          <label class="btn ghost small" id="open">Open file<input type="file" accept=".html,.htm,.css,.svg,.xml,.txt,text/html,text/css,text/plain" hidden></label>
          <button class="btn ghost small" id="clear">Clear</button>
        </div>
      </div>
      <label class="field"><span class="sr">Code input</span>
        <textarea class="textarea" id="input" spellcheck="false" placeholder="Paste HTML or CSS here"></textarea>
      </label>
      <div class="row hc-opts">
        <label class="field">Indent
          <select class="select" id="indent">
            <option value="2">2 spaces</option>
            <option value="4">4 spaces</option>
            <option value="tab">Tab</option>
          </select>
        </label>
        <label class="check"><input type="checkbox" id="nocom"> Remove comments</label>
      </div>
      <div class="row">
        <button class="btn primary" id="beautify">Beautify</button>
        <button class="btn" id="minify">Minify</button>
        <span class="grow"></span>
        <span class="chip" id="status">Waiting for code</span>
      </div>
    </section>

    <section class="card stack">
      <div class="row between">
        <h2>Output</h2>
        <div class="row">
          <button class="btn small" id="copy"><svg class="i"><use href="#i-copy"/></svg>Copy</button>
          <button class="btn small" id="save"><svg class="i"><use href="#i-download"/></svg><span id="ext">.html</span></button>
        </div>
      </div>
      <pre class="out hc-out" id="out" tabindex="0"></pre>
      <div class="stats" id="stats"></div>
    </section>
  </div>
</main>
<script src="app.js"></script>
